<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Mobile Menu UI — Bottom Navigation Builder">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>

  <!-- decorative grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200"/>
    <path d="M300 0 V300 M600 0 V300 M900 0 V300"/>
  </g>

  <!-- phone mockup -->
  <g filter="url(#softShadow)">
    <rect x="905" y="45" width="180" height="210" rx="26" fill="#0b1023" stroke="#818cf8" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="917" y="57" width="156" height="186" rx="16" fill="url(#screen)"/>
    <rect x="967" y="63" width="56" height="7" rx="3.5" fill="#0b1023"/>
    <circle cx="940" cy="105" r="13" fill="#818cf8" fill-opacity="0.85"/>
    <rect x="930" y="128" width="90" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="942" y="142" width="66" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.15"/>
    <!-- nav bar inside phone -->
    <rect x="929" y="196" width="132" height="36" rx="12" fill="#111638" stroke="#c084fc" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="941" y="206" width="16" height="16" rx="4" fill="#c084fc"/>
    <circle cx="995" cy="214" r="8" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="1023" cy="214" r="8" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="1049" cy="214" r="8" fill="#f472b6" fill-opacity="0.8"/>
  </g>

  <!-- titles -->
  <text x="80" y="128" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff">Mobile Menu UI</text>
  <text x="82" y="172" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" fill="url(#accent)">11 Bottom Navigation Bar Styles</text>

  <!-- tech chips -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">
    <g>
      <rect x="82" y="200" width="86" height="32" rx="16" fill="#818cf8" fill-opacity="0.16" stroke="#818cf8" stroke-opacity="0.65"/>
      <text x="125" y="221" text-anchor="middle" fill="#a5b4fc">React 19</text>
    </g>
    <g>
      <rect x="178" y="200" width="106" height="32" rx="16" fill="#c084fc" fill-opacity="0.14" stroke="#c084fc" stroke-opacity="0.6"/>
      <text x="231" y="221" text-anchor="middle" fill="#d8b4fe">TypeScript</text>
    </g>
    <g>
      <rect x="294" y="200" width="118" height="32" rx="16" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.55"/>
      <text x="353" y="221" text-anchor="middle" fill="#7dd3fc">Tailwind CSS 4</text>
    </g>
    <g>
      <rect x="422" y="200" width="134" height="32" rx="16" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.55"/>
      <text x="489" y="221" text-anchor="middle" fill="#f9a8d4">Framer Motion</text>
    </g>
  </g>

  <text x="82" y="264" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#94a3b8">Live simulator &#183; Customizer &#183; Code exporter &#183; RTL &amp; Dark mode</text>
</svg>
